name: Scrape jobs

on:
  schedule:
    # Hourly at :23 (off-peak minute — top of the hour gets throttled/dropped by GitHub).
    # Hours are UTC: skipping 5-8 UTC = quiet 1:00-4:59 AM Montreal (EDT). Shifts 1h with DST.
    - cron: "23 0-4,9-23 * * *"
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
        run: python -m scraper.main

      - name: Commit updated snapshot
        run: |
          if git diff --quiet docs/jobs.json; then
            echo "No changes to jobs.json — skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          git commit -m "chore: update jobs snapshot"
          # Remote may have moved while we scraped (config push, other run).
          # Rebase onto it; our snapshot is freshest, so it wins any jobs.json conflict.
          git pull --rebase -X theirs origin main
          git push
